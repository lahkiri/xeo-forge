<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Xeo Forge V3 context studio</title><desc id="desc">Prompt Studio interface for managing pinned instructions and persistent memory without source changes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#0b1c34"/></linearGradient></defs>
<rect width="1440" height="900" rx="24" fill="url(#bg)"/><rect x="24" y="24" width="1392" height="852" rx="18" fill="#09182c" stroke="#1e385e"/><rect x="24" y="24" width="242" height="852" rx="18" fill="#081326"/>
<image href="xeo-forge-mark.png" x="52" y="46" width="42" height="42"/><text x="108" y="76" font-family="Arial" font-weight="700" font-size="23" fill="#f4f8ff">Xeo Forge</text><text x="54" y="138" font-family="Arial" font-size="12" fill="#6e8caf" letter-spacing="2">CONTROL PLANE</text>
<g font-family="Arial" font-size="15"><text x="66" y="194" fill="#8fa6c4">Command center</text><rect x="44" y="218" width="202" height="48" rx="12" fill="#12315a"/><text x="66" y="248" fill="#e9f4ff">Prompt Studio</text><text x="66" y="302" fill="#8fa6c4">Agent Profiles</text><text x="66" y="350" fill="#8fa6c4">Agent Skills</text><text x="66" y="398" fill="#8fa6c4">Memory inbox</text></g>
<g font-family="Arial"><text x="306" y="92" font-size="28" font-weight="700" fill="#f5f9ff">Prompt Studio</text><text x="306" y="124" font-size="15" fill="#91a9c7">Shape how your agents work without editing source code.</text><rect x="1160" y="66" width="174" height="44" rx="10" fill="#1594ff"/><text x="1190" y="94" font-size="14" font-weight="700" fill="#fff">Add instruction</text>
<rect x="306" y="166" width="1028" height="100" rx="16" fill="#101f37" stroke="#23466f"/><text x="334" y="202" font-size="13" fill="#7dbfff" letter-spacing="1.4">ACTIVE POLICY STACK</text><text x="334" y="238" font-size="18" font-weight="700" fill="#f2f7ff">4 pinned instructions</text><text x="712" y="238" font-size="14" fill="#91a9c7">System 2  |  User 1  |  Task 1</text><text x="1158" y="238" font-size="14" fill="#55d39a">All active</text>
<text x="306" y="322" font-size="18" font-weight="700" fill="#edf4ff">Pinned instructions</text><rect x="306" y="350" width="1028" height="118" rx="14" fill="#0d1c31" stroke="#1d385a"/><circle cx="342" cy="390" r="8" fill="#55d39a"/><text x="368" y="394" font-size="16" font-weight="700" fill="#d9e8fa">Verification first</text><text x="368" y="426" font-size="14" fill="#7792b3">Always run the relevant tests and report evidence before claiming completion.</text><text x="1220" y="394" font-size="13" fill="#7dbfff">SYSTEM</text><rect x="306" y="484" width="1028" height="118" rx="14" fill="#0d1c31" stroke="#1d385a"/><circle cx="342" cy="524" r="8" fill="#55d39a"/><text x="368" y="528" font-size="16" font-weight="700" fill="#d9e8fa">Product voice</text><text x="368" y="560" font-size="14" fill="#7792b3">Keep user-facing results concise, honest and focused on observable outcomes.</text><text x="1228" y="528" font-size="13" fill="#7dbfff">USER</text>
<text x="306" y="658" font-size="18" font-weight="700" fill="#edf4ff">Memory inbox</text><rect x="306" y="686" width="1028" height="116" rx="14" fill="#0d1c31" stroke="#1d385a"/><text x="338" y="724" font-size="15" fill="#d9e8fa">The user prefers SQLite-first local development.</text><text x="338" y="754" font-size="13" fill="#7792b3">Suggested by a successful task  |  confidence 0.92</text><rect x="1118" y="716" width="82" height="34" rx="8" fill="#12315a"/><text x="1140" y="738" font-size="13" fill="#bfe2ff">Approve</text><rect x="1212" y="716" width="82" height="34" rx="8" fill="#17263c" stroke="#2b486b"/><text x="1233" y="738" font-size="13" fill="#a8bdd5">Archive</text></g>
</svg>
