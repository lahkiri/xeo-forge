name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.22.x'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        run: |
          npm run typecheck
          npm test -- --run
          git diff --check

      - name: Prepare and smoke test desktop runtime
        run: npm run desktop:prepare && node scripts/smoke-desktop.mjs

      - name: Build Windows installer and update feed
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REF_NAME -match '-') { 'beta' } else { 'latest' }
          npx electron-builder --win nsis --x64 "--config.publish.channel=$channel" --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REF_NAME -match '-') { 'beta' } else { 'latest' }
          if (-not (Test-Path "dist/$channel.yml")) { throw "dist/$channel.yml was not generated" }
          if (-not (Get-ChildItem dist/*.exe)) { throw 'Windows installer was not generated' }
          node scripts/verify-release-artifacts.mjs dist windows $channel

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xeo-forge-windows-release
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        run: |
          npm run typecheck
          npm test -- --run
          git diff --check
          npm run browser:smoke

      - name: Prepare and smoke test desktop runtime
        run: npm run desktop:prepare && node scripts/smoke-desktop.mjs

      - name: Build Linux AppImage and deb packages
        run: |
          channel="latest"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then channel="beta"; fi
          npx electron-builder --linux AppImage deb --x64 "--config.publish.channel=${channel}" --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Linux artifacts
        run: |
          channel="latest"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then channel="beta"; fi
          test -f "dist/${channel}-linux.yml"
          test -n "$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          node scripts/verify-release-artifacts.mjs dist linux "${channel}"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xeo-forge-linux-release
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: xeo-forge-windows-release
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: xeo-forge-linux-release
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_title="Xeo Forge ${TAG_NAME} — Local-First Agent Workbench"
          notes_file="docs/release-notes/${TAG_NAME}.md"
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=(--repo "$GITHUB_REPOSITORY" --title "$release_title" --verify-tag)
            if [[ "$TAG_NAME" == *-* ]]; then
              release_args+=(--prerelease --latest=false)
            else
              release_args+=(--latest)
            fi
            if [ -f "$notes_file" ]; then
              gh release create "$TAG_NAME" "${release_args[@]}" --notes-file "$notes_file"
            else
              gh release create "$TAG_NAME" "${release_args[@]}" \
                --notes "Xeo Forge ${TAG_NAME} continues the Local-First Agent Workbench. Upgrade from the minimum supported OTA bootstrap version and always use the latest release.\n\nGitHub's generated changelog follows." \
                --generate-notes
            fi
          fi
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
